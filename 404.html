<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Sofia & Marco</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Great+Vibes&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--cream);
      padding: 2rem;
    }
    .error-number {
      font-family: var(--ff-script);
      font-size: clamp(6rem, 20vw, 12rem);
      color: var(--gold);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-family: var(--ff-serif);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--brown-dark);
      margin-bottom: 1rem;
    }
    .error-text {
      font-size: 1.1rem;
      color: var(--text-light);
      max-width: 480px;
      margin: 0 auto 2.5rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <div class="error-number">404</div>
      <h1 class="error-title">Page introuvable</h1>
      <p class="error-text">Cette page s'est peut-être égarée quelque part sur la Méditerranée… Retournez à l'accueil pour retrouver votre chemin.</p>
      <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Retour à l'accueil</a>
    </div>
  </div>
</body>
</html>
